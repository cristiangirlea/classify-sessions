# Published only on 127.0.0.1:8088 (docker-compose.yml). nginx checks Host and Origin itself
# before it rewrites Host for the API, so a DNS-rebinding name or a foreign page cannot pass
# through the rewrite. Error bodies follow contract/error.schema.json.

map $http_origin $origin_ok {
    ""                      1;
    "http://127.0.0.1:8088" 1;
    "http://localhost:8088" 1;
    default                 0;
}

# Any Host other than the two loopback names below.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 403 '{"error":{"code":"forbidden","message":"host must be a loopback address"}}';
}

server {
    listen 80;
    server_name 127.0.0.1 localhost;
    server_tokens off;
    root /usr/share/nginx/html;
    # Applies to the inline error body below; built files keep their types from mime.types.
    default_type application/json;

    if ($origin_ok = 0) {
        return 403 '{"error":{"code":"forbidden","message":"origin must be this page"}}';
    }

    # The API sets its own headers (no-store, nosniff, no-referrer, default-src 'none',
    # same-origin resource policy); nginx adds none here so they are not duplicated.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host 127.0.0.1:8080;
        proxy_set_header Origin "";
        proxy_set_header X-Forwarded-For "";
    }

    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
